<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thank you · Nabo</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F7F6F2;--card:#fff;--ink:#141413;--muted:#5d5c57;--accent:#1F6B5C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A17;--card:#17241F;--ink:#F2F1EC;--muted:#A9B3AE;--accent:#5FC2A8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,system-ui,"Inter",sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px 16px}
main{background:var(--card);border-radius:24px;padding:32px 24px;max-width:440px;width:100%;text-align:center}
.mark{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
h1{font-size:24px;margin:0 0 8px}p{color:var(--muted);margin:0 0 20px}
a.button{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:14px;border-radius:14px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 64 64"><path d="M18 46V28l14-11 14 11v18H36V34h-8v12z" fill="currentColor"/></svg></div>
  <h1 id="title">Thank you!</h1>
  <p id="body">Your building is being activated. It takes a minute; you'll find the invoice in your email.</p>
  <a class="button" id="open" href="nabo://">Back to Nabo</a>
</main>
<script>
(function () {
  var t = {
    sq: ["Faleminderit!", "Pallati juaj po aktivizohet. Zgjat një minutë; faturën do ta gjeni në email.", "Kthehuni te Nabo"],
    fr: ["Merci !", "Votre immeuble est en cours d’activation. Cela prend une minute ; vous trouverez la facture dans vos e-mails.", "Retour à Nabo"],
    it: ["Grazie!", "Il tuo condominio è in fase di attivazione. Ci vuole un minuto; troverai la fattura nella tua email.", "Torna a Nabo"],
    de: ["Vielen Dank!", "Ihr Haus wird freigeschaltet. Das dauert eine Minute; die Rechnung finden Sie in Ihrem Postfach.", "Zurück zu Nabo"],
    es: ["¡Gracias!", "Tu edificio se está activando. Tarda un minuto; encontrarás la factura en tu correo.", "Volver a Nabo"]
  };
  var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
  var s = t[lang];
  if (!s) return;
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = s[0];
  document.getElementById("body").textContent = s[1];
  document.getElementById("open").textContent = s[2];
})();
</script>
</body>
</html>
